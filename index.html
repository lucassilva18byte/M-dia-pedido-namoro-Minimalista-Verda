<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido</title>

<style>
:root{
  --fundo:#0c0f0d;
  --card:#151917;
  --verde:#27c46b;
  --verde-suave:#7ef0b4;
  --texto:#e9f5ee;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter', sans-serif;
}

body{
  height:100vh;
  background:var(--fundo);
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--texto);
  overflow:hidden;
  position:relative;
}

/* partículas bem discretas */
.particulas span{
  position:absolute;
  width:2px;
  height:2px;
  background:rgba(39,196,107,0.25);
  border-radius:50%;
  animation:subir 25s linear infinite;
}

@keyframes subir{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

/* corações quase invisíveis */
.coracoes span{
  position:absolute;
  font-size:12px;
  opacity:0.05;
  animation:flutuar 35s linear infinite;
}

@keyframes flutuar{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

.card{
  background:var(--card);
  padding:60px 50px;
  width:90%;
  max-width:480px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  position:relative;
  z-index:2;
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}

h1{
  font-size:20px;
  font-weight:500;
  margin-bottom:30px;
  letter-spacing:1px;
  color:var(--verde-suave);
}

.texto{
  font-size:16px;
  min-height:100px;
  margin-bottom:30px;
  line-height:1.6;
  color:#cfe9dc;
}

button{
  padding:9px 22px;
  border-radius:6px;
  border:1px solid var(--verde);
  background:transparent;
  color:var(--verde);
  cursor:pointer;
  transition:0.25s ease;
  font-size:14px;
}

button:hover{
  background:var(--verde);
  color:#0c0f0d;
}

.final{
  margin-top:20px;
  font-size:17px;
  color:var(--verde-suave);
  opacity:0;
  animation:aparecer 1s ease forwards;
}

@keyframes aparecer{
  to{opacity:1;}
}
</style>
</head>

<body>

<div class="particulas"></div>
<div class="coracoes"></div>

<div class="card">
  <h1>Eu queria te perguntar algo</h1>
  <div class="texto" id="texto"></div>
  <div id="botoes">
    <button onclick="proximaFrase()">Continuar</button>
  </div>
  <div id="finalMsg"></div>
</div>

<script>

/* partículas */
const particulas = document.querySelector(".particulas");
for(let i=0;i<20;i++){
  let p=document.createElement("span");
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(20+Math.random()*15)+"s";
  particulas.appendChild(p);
}

/* corações */
const coracoes = document.querySelector(".coracoes");
for(let i=0;i<8;i++){
  let h=document.createElement("span");
  h.innerHTML="💚";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(30+Math.random()*20)+"s";
  coracoes.appendChild(h);
}

/* texto */
const frases=[
"Você trouxe leveza para minha vida.",
"Transformou momentos simples em especiais.",
"E eu quero continuar construindo isso com você.",
"Então eu preciso saber..."
];

let index = 0;
let escrevendo = false;
const texto = document.getElementById("texto");
const botoes = document.getElementById("botoes");
const finalMsg = document.getElementById("finalMsg");

function digitarFrase(frase){
    escrevendo = true;
    texto.innerHTML = "";
    let char = 0;

    function escrever(){
        if(char < frase.length){
            texto.innerHTML += frase.charAt(char);
            char++;
            setTimeout(escrever, 28);
        } else {
            escrevendo = false;
        }
    }
    escrever();
}

function proximaFrase(){
    if(escrevendo) return;

    if(index < frases.length){
        digitarFrase(frases[index]);
        index++;
    } else {
        mostrarPedido();
    }
}

function mostrarPedido(){
    texto.innerHTML = "Você aceita namorar comigo?";
    botoes.innerHTML = `
        <button onclick="aceitou()">Sim</button>
        <button onmouseover="fugir(this)">Não</button>
    `;
}

function fugir(btn){
    btn.style.position="relative";
    btn.style.left = (Math.random()*35 - 15) + "px";
}

function aceitou(){
    botoes.style.display="none";
    finalMsg.innerHTML="<div class='final'>Agora é oficial 💚</div>";
}

</script>

</body>
</html>
