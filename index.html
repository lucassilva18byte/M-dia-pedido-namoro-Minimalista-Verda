<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido 💚</title>

<style>
:root{
  --verde-fundo:#0f1f17;
  --verde-card:#162a20;
  --verde-destaque:#2ecc71;
  --verde-suave:#8ef5c3;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Inter', sans-serif;
}

body{
  height:100vh;
  background:var(--verde-fundo);
  display:flex;
  justify-content:center;
  align-items:center;
  color:#e8fff3;
  overflow:hidden;
  position:relative;
}

/* PARTÍCULAS */
.particulas span{
  position:absolute;
  width:3px;
  height:3px;
  background:rgba(142,245,195,0.4);
  border-radius:50%;
  animation:subir 18s linear infinite;
  opacity:0.4;
}

/* CORAÇÕES */
.coracoes span{
  position:absolute;
  font-size:14px;
  opacity:0.08;
  animation:flutuar 25s linear infinite;
}

@keyframes subir{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

@keyframes flutuar{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

.card{
  background:var(--verde-card);
  padding:60px 50px;
  width:90%;
  max-width:500px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
  animation:fadeIn 1.2s ease;
  position:relative;
  z-index:2;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

h1{
  font-size:22px;
  font-weight:500;
  margin-bottom:30px;
  color:var(--verde-suave);
}

.texto{
  font-size:17px;
  min-height:100px;
  margin-bottom:30px;
  line-height:1.6;
  color:#c8ffe4;
}

button{
  padding:10px 26px;
  border-radius:8px;
  border:1px solid var(--verde-destaque);
  background:transparent;
  color:var(--verde-destaque);
  cursor:pointer;
  transition:0.25s;
  font-size:14px;
  margin:5px;
}

button:hover{
  background:var(--verde-destaque);
  color:#0f1f17;
}

.final{
  margin-top:20px;
  font-size:18px;
  color:var(--verde-suave);
  opacity:0;
  animation:aparecer 1s ease forwards;
}

@keyframes aparecer{
  to{opacity:1;}
}
</style>
</head>

<body>

<div class="particulas"></div>
<div class="coracoes"></div>

<div class="card">
  <h1>Tem algo importante 💚</h1>
  <div class="texto" id="texto"></div>
  <div id="botoes">
    <button onclick="proximaFrase()" id="continuar">Continuar</button>
  </div>
  <div id="finalMsg"></div>
</div>

<script>

/* PARTÍCULAS */
const particulas = document.querySelector(".particulas");
for(let i=0;i<30;i++){
  let p=document.createElement("span");
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(15+Math.random()*10)+"s";
  particulas.appendChild(p);
}

/* CORAÇÕES */
const coracoes = document.querySelector(".coracoes");
for(let i=0;i<15;i++){
  let h=document.createElement("span");
  h.innerHTML="💚";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(20+Math.random()*15)+"s";
  h.style.fontSize=(12+Math.random()*8)+"px";
  coracoes.appendChild(h);
}

/* TEXTO */
const frases=[
"Eu gosto da calma que você me traz.",
"Do jeito leve que você muda meu dia.",
"Da paz que sinto quando estou com você.",
"E eu queria transformar isso em algo ainda mais especial..."
];

let index = 0;
let escrevendo = false;
const texto = document.getElementById("texto");
const botoes = document.getElementById("botoes");
const finalMsg = document.getElementById("finalMsg");

function digitarFrase(frase){
    escrevendo = true;
    texto.innerHTML = "";
    let char = 0;

    function escrever(){
        if(char < frase.length){
            texto.innerHTML += frase.charAt(char);
            char++;
            setTimeout(escrever, 30);
        } else {
            escrevendo = false;
        }
    }
    escrever();
}

function proximaFrase(){
    if(escrevendo) return;

    if(index < frases.length){
        digitarFrase(frases[index]);
        index++;
    } else {
        mostrarPedido();
    }
}

function mostrarPedido(){
    texto.innerHTML = "Você aceita namorar comigo?";
    botoes.innerHTML = `
        <button onclick="aceitou()">Sim</button>
        <button onmouseover="fugir(this)">Não</button>
    `;
}

function fugir(btn){
    btn.style.position="relative";
    btn.style.left = (Math.random()*40 - 20) + "px";
    btn.style.top = (Math.random()*20 - 10) + "px";
}

function aceitou(){
    botoes.style.display="none";
    finalMsg.innerHTML="<div class='final'>Então agora é oficial 💚</div>";
}

</script>

</body>
</html>
